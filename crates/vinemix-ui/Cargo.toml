[package]
name = "vinemix-ui"
description = "VineMix desktop: the node workspace, engine connection and Windows integration."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# The single-file distribution: VineMix.exe carries the engine runtime.
# Build with VINEMIX_RUNTIME_ZIP and VINEMIX_RUNTIME_MANIFEST set.
standalone = []
# Orange-tile icon and "(Rust)" window title, to tell a Rust build apart
# from an installed 0.5 on the same machine (scripts/generate-rust-edition-icons.ps1).
rust-edition = []

[[bin]]
name = "vinemix"
path = "src/main.rs"

[dependencies]
vinemix-model.workspace = true
vinemix-update = { path = "../vinemix-update" }
vinemix-platform = { path = "../vinemix-platform" }
serde.workspace = true
serde_json.workspace = true
eframe = { version = "0.37", default-features = false, features = ["accesskit", "default_fonts", "glow", "persistence"] }
egui_extras = { version = "0.37", default-features = false, features = ["svg"] }

[dev-dependencies]
vinemix-update = { path = "../vinemix-update", features = ["testing"] }
# The real control-pipe server, for connection integration tests.
vinemix-engine = { path = "../vinemix-engine" }

[target.'cfg(windows)'.dependencies]
windows.workspace = true
