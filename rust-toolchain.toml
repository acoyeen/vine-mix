# Exact stable release, matching the project's pinned-tool policy.
# The host and target are x86_64-pc-windows-gnullvm, linked by the pinned
# llvm-mingw toolchain in .tools (see scripts/rust-env.ps1).
[toolchain]
channel = "1.99.1"
targets = ["x86_64-pc-windows-gnullvm"]
components = ["rustfmt", "clippy"]
profile = "minimal"
