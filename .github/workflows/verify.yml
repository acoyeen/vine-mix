name: Windows build and offline verification

on:
  push:
    branches: [main, rust-rewrite]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The released 0.5 application: .NET desktop and native engine. This job
  # compiles no Rust; a green result here says nothing about the Rust candidate.
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Cache pinned local tools
        id: tools
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            .tools/dotnet
            .tools/llvm-mingw-20261006-ucrt-x86_64
            .tools/cmake-4.4.4-windows-x86_64
          key: windows-tools-${{ hashFiles('scripts/bootstrap-tools.ps1') }}
      - name: Prepare pinned source inventory tool
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'ripgrep.zip'
          Invoke-WebRequest -Uri 'https://github.com/BurntSushi/ripgrep/releases/download/15.2.0/ripgrep-15.2.0-x86_64-pc-windows-msvc.zip' -OutFile $archive
          $expected = '71b2fef860abe467217a538ff31de02f5258807c0129f771846f87bd029aafc5'
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) {
            throw 'The source inventory tool download failed integrity verification.'
          }
          $directory = Join-Path $env:RUNNER_TEMP 'ripgrep'
          Expand-Archive -LiteralPath $archive -DestinationPath $directory
          $tool = Join-Path $directory 'ripgrep-15.2.0-x86_64-pc-windows-msvc'
          $tool | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & (Join-Path $tool 'rg.exe') --version
          if ($LASTEXITCODE) { throw 'The source inventory tool could not run.' }
      - name: Build application package
        run: ./scripts/build.ps1
      - name: Save pinned local tools
        if: steps.tools.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .tools/dotnet
            .tools/llvm-mingw-20261006-ucrt-x86_64
            .tools/cmake-4.4.4-windows-x86_64
          key: windows-tools-${{ hashFiles('scripts/bootstrap-tools.ps1') }}
      - name: Verify updater and signed release preparation
        run: |
          New-Item -ItemType Directory -Path "$PWD/artifacts/ci-verification" | Out-Null
          & ./.tools/dotnet/dotnet.exe run --project desktop/VineMix.UpdateCore.Tests -c Release -- --report "$PWD/artifacts/ci-verification/update-core.json"
          if ($LASTEXITCODE) { throw 'Update-core verification failed.' }
          & ./.tools/dotnet/dotnet.exe run --project desktop/VineMix.UpdateWorkerTests -c Release
          if ($LASTEXITCODE) { throw 'Update-worker verification failed.' }
          ./scripts/test-update-release-tools.ps1 -EvidencePath "$PWD/artifacts/ci-verification/release-tools.json"
      - name: Run synthetic audio, production serialization and detached desktop checks
        # Hosted CPU capacity varies. Keep all workloads/assertions, and retain
        # actual 5-ms exceedances separately from correctness. Local/release
        # qualification remains strict unless this explicit switch is supplied.
        run: ./scripts/verify-offline.ps1 -HostedBenchmarkReport -ResultDirectory "$env:RUNNER_TEMP/vinemix-offline-verification" -BuildDirectory "$env:RUNNER_TEMP/vinemix-offline-native"
      - name: Retain verification reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: offline-verification
          path: |
            artifacts/ci-verification/*.json
            ${{ runner.temp }}/vinemix-offline-verification/*.json
            ${{ runner.temp }}/vinemix-offline-verification/*.txt
            ${{ runner.temp }}/vinemix-offline-verification/ui/*.json
            ${{ runner.temp }}/vinemix-offline-verification/ui/*.png
            ${{ runner.temp }}/vinemix-offline-verification/test-controller-identity/results.json
            ${{ runner.temp }}/vinemix-offline-verification/test-local-ui-activation/results.json
            ${{ runner.temp }}/vinemix-offline-verification/creative-benchmark-policy/*.json
            ${{ runner.temp }}/vinemix-offline-verification/creative-benchmark-policy/*.txt
          if-no-files-found: ignore
          retention-days: 14

  # The Rust candidate: pinned toolchain and target, lint gate, every test
  # suite against its expected counts, the C/C++ parity oracle and the update
  # record cross-check with the 0.5 serializer (scripts/verify-rust.ps1).
  # Nothing may be skipped here: missing reference sources fail the build and
  # an unaccounted ignored test fails the run.
  rust:
    name: Rust candidate (build, lint, tests, parity)
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Cache pinned local tools
        id: tools
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            .tools/dotnet
            .tools/llvm-mingw-20261006-ucrt-x86_64
            .tools/cmake-4.4.4-windows-x86_64
          key: windows-tools-${{ hashFiles('scripts/bootstrap-tools.ps1') }}
      - name: Prepare pinned local tools
        run: ./scripts/bootstrap-tools.ps1
      - name: Install the pinned Rust toolchain
        # The release and the build target come from the repository's own pins.
        # The host is set to the build target so build scripts link with the
        # pinned LLVM-MinGW, as they do on the maintainer's machine.
        run: |
          $channel = [regex]::Match((Get-Content rust-toolchain.toml -Raw), '(?m)^\s*channel\s*=\s*"([^"]+)"').Groups[1].Value
          $target = (Get-Content tools/rust-pins.json -Raw | ConvertFrom-Json).target
          if (-not $channel -or -not $target) { throw 'The Rust pins could not be read.' }
          rustup set default-host $target
          if ($LASTEXITCODE) { throw 'The Rust host could not be selected.' }
          rustup toolchain install $channel --profile minimal --component clippy --component rustfmt --target $target --no-self-update
          if ($LASTEXITCODE) { throw 'The pinned Rust toolchain could not be installed.' }
          rustup show
      - name: Cache locked crates
        id: crates
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
          key: cargo-registry-${{ hashFiles('Cargo.lock') }}
      - name: Fetch locked crates
        run: |
          cargo fetch --locked
          if ($LASTEXITCODE) { throw 'The locked crates could not be fetched.' }
      - name: Provide parity reference sources
        run: ./scripts/fetch-reference-sources.ps1
      - name: Verify the Rust candidate
        run: ./scripts/verify-rust.ps1 -ResultDirectory "$env:RUNNER_TEMP/vinemix-rust-verification"
      - name: Build and smoke-test the installed and standalone Rust packages
        run: ./scripts/build-rust-release.ps1 -SkipInstaller -StageDirectory "$env:RUNNER_TEMP/vinemix-rust-package"
      - name: Save pinned local tools
        if: steps.tools.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .tools/dotnet
            .tools/llvm-mingw-20261006-ucrt-x86_64
            .tools/cmake-4.4.4-windows-x86_64
          key: windows-tools-${{ hashFiles('scripts/bootstrap-tools.ps1') }}
      - name: Save locked crates
        if: steps.crates.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
          key: cargo-registry-${{ hashFiles('Cargo.lock') }}
      - name: Retain Rust verification reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-verification
          path: |
            ${{ runner.temp }}/vinemix-rust-verification/results.json
            ${{ runner.temp }}/vinemix-rust-verification/lint-stderr.txt
            ${{ runner.temp }}/vinemix-rust-verification/build-tests.txt
            ${{ runner.temp }}/vinemix-rust-verification/suites/*.txt
            ${{ runner.temp }}/vinemix-rust-verification/interop/*.txt
            ${{ runner.temp }}/vinemix-rust-verification/tools/*.txt
          if-no-files-found: ignore
          retention-days: 14
