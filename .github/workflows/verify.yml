name: Windows build and offline verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Cache pinned local tools
        id: tools
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            .tools/dotnet
            .tools/llvm-mingw-20261006-ucrt-x86_64
            .tools/cmake-4.4.4-windows-x86_64
          key: windows-tools-${{ hashFiles('scripts/bootstrap-tools.ps1') }}
      - name: Build application package
        run: ./scripts/build.ps1
      - name: Save pinned local tools
        if: steps.tools.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            .tools/dotnet
            .tools/llvm-mingw-20261006-ucrt-x86_64
            .tools/cmake-4.4.4-windows-x86_64
          key: windows-tools-${{ hashFiles('scripts/bootstrap-tools.ps1') }}
      - name: Run synthetic audio and detached desktop checks
        run: ./scripts/verify-offline.ps1 -ResultDirectory "$PWD/artifacts/ci-verification"
      - name: Retain verification reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: offline-verification
          path: artifacts/ci-verification
          if-no-files-found: ignore
          retention-days: 14
