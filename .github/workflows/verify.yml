name: Windows build and offline verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Cache pinned local tools
        id: tools
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            .tools/dotnet
            .tools/llvm-mingw-20261006-ucrt-x86_64
            .tools/cmake-4.4.4-windows-x86_64
          key: windows-tools-${{ hashFiles('scripts/bootstrap-tools.ps1') }}
      - name: Prepare pinned source inventory tool
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'ripgrep.zip'
          Invoke-WebRequest -Uri 'https://github.com/BurntSushi/ripgrep/releases/download/15.2.0/ripgrep-15.2.0-x86_64-pc-windows-msvc.zip' -OutFile $archive
          $expected = '71b2fef860abe467217a538ff31de02f5258807c0129f771846f87bd029aafc5'
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) {
            throw 'The source inventory tool download failed integrity verification.'
          }
          $directory = Join-Path $env:RUNNER_TEMP 'ripgrep'
          Expand-Archive -LiteralPath $archive -DestinationPath $directory
          $tool = Join-Path $directory 'ripgrep-15.2.0-x86_64-pc-windows-msvc'
          $tool | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & (Join-Path $tool 'rg.exe') --version
          if ($LASTEXITCODE) { throw 'The source inventory tool could not run.' }
      - name: Build application package
        run: ./scripts/build.ps1
      - name: Save pinned local tools
        if: steps.tools.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            .tools/dotnet
            .tools/llvm-mingw-20261006-ucrt-x86_64
            .tools/cmake-4.4.4-windows-x86_64
          key: windows-tools-${{ hashFiles('scripts/bootstrap-tools.ps1') }}
      - name: Verify updater and signed release preparation
        run: |
          & ./.tools/dotnet/dotnet.exe run --project desktop/VineMix.UpdateCore.Tests -c Release -- --report "$PWD/artifacts/ci-verification/update-core.json"
          if ($LASTEXITCODE) { throw 'Update-core verification failed.' }
          & ./.tools/dotnet/dotnet.exe run --project desktop/VineMix.UpdateWorkerTests -c Release
          if ($LASTEXITCODE) { throw 'Update-worker verification failed.' }
          ./scripts/test-update-release-tools.ps1 -EvidencePath "$PWD/artifacts/ci-verification/release-tools.json"
      - name: Run synthetic audio and detached desktop checks
        run: ./scripts/verify-offline.ps1 -ResultDirectory "$PWD/artifacts/ci-verification"
      - name: Retain verification reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: offline-verification
          path: artifacts/ci-verification
          if-no-files-found: ignore
          retention-days: 14
