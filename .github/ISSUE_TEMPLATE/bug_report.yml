name: Bug report
description: Report a reproducible problem with Vine Mix.
body:
  - type: input
    id: version
    attributes:
      label: App and Windows versions
      placeholder: Vine Mix 0.2.0, Windows 11
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: What happened?
      description: Include steps to reproduce, what you expected and what actually happened.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Relevant diagnostics or screenshots
      description: Remove personal device identifiers, executable paths and private settings before sharing.
